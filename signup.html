<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가입 | Chiropractic</title>
  <link rel="stylesheet" href="./assets/main.css?v=20260526a" />
<script defer src="./assets/ui.js?v=20260526a"></script>
<script defer src="./assets/download-guard.js?v=20260526a"></script>
<script defer src="./assets/hide-guard.js?v=20260526a"></script>
<script defer src="./assets/pdf-viewer.js?v=20260526a"></script>
  <script src="./assets/config.js?v=20260526a"></script>
  <style>
    .auth-card{max-width:460px;margin:4rem auto;padding:2.5rem;background:#fff;border:1px solid #e0e0e3;border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.04)}
    .auth-card h1{margin:0 0 .5rem;font-size:1.7rem}
    .auth-card p.lead{color:#666;margin:0 0 1.5rem;font-size:.93em;line-height:1.5}
    .auth-card label{display:block;font-size:.85em;color:#444;margin:.85rem 0 .35rem;font-weight:600}
    .auth-card input,.auth-card select{width:100%;padding:.7rem 1rem;border:1px solid #d2d2d7;border-radius:10px;font-size:.95em;font-family:inherit;box-sizing:border-box}
    .auth-card button[type=submit]{width:100%;padding:.85rem;border:none;border-radius:10px;background:#0a84ff;color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem;font-size:.95em}
    .auth-card .btn-google{width:100%;padding:.75rem;border:1px solid #d2d2d7;border-radius:10px;background:#fff;font-weight:500;cursor:pointer;font-size:.95em;display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:inherit}
    .auth-card .divider{text-align:center;margin:1.25rem 0;color:#999;font-size:.85em;position:relative}
    .auth-card .divider::before,.auth-card .divider::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:#e8e8eb}
    .auth-card .divider::before{left:0}.auth-card .divider::after{right:0}
    .auth-card .alt{text-align:center;margin-top:1.25rem;font-size:.88em;color:#666}
    .auth-card .alt a{color:#0a84ff;text-decoration:none}
    .notice{background:#fff8e6;border-left:3px solid #f5a623;padding:.7rem 1rem;border-radius:6px;font-size:.85em;color:#664500;line-height:1.5;margin-bottom:1.25rem}
    .err{color:#c62828;font-size:.88em;margin-top:.5rem;min-height:1em;background:#fdecea;padding:.5rem .75rem;border-radius:6px;display:none}
    .err.show{display:block}
    .ok{color:#2e7d32;font-size:.95em;text-align:center;line-height:1.6;padding:1.5rem 0}

    /* 잠긴 챕터에서 튕겨 들어온 경우(?next=...) 좌측 상단 brand를 깜빡여 "홈으로 돌아가기" 동선을 시각적으로 유도 */
    @keyframes navBrandPulse {
      0%, 100% { box-shadow: 0 0 0 2px transparent, 0 0 0 0 rgba(10,132,255,0); }
      50%      { box-shadow: 0 0 0 2px rgba(10,132,255,.65), 0 0 14px rgba(10,132,255,.35); }
    }
    .nav-brand.cta-blink {
      border-radius: 12px;
      padding: 4px 12px;
      animation: navBrandPulse 1.4s ease-in-out infinite;
    }
    .nav-brand.cta-blink::after {
      content: '← 홈으로';
      margin-left: 8px;
      font-size: .72em;
      color: #0a84ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <nav class="site-nav"><div class="nav-inner">
    <a class="nav-brand" href="./index.html"><span class="mark"></span><span>Chiropractic</span></a>
  </div></nav>

  <div class="auth-card" id="card">
    <h1>가입 신청</h1>
    <p class="lead">의료인(MD/PT) 대상 비영리 교육자료. 가입 신청 후 관리자가 자격을 확인해 직접 승인합니다 (보통 1–2일). 승인 전엔 챕터 2~12 접근이 제한됩니다.</p>

    <div class="notice"><strong>자격 확인용 정보</strong>를 정확히 입력해주세요. 거짓 정보 시 접근이 차단됩니다.</div>

    <button id="google-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.1-.2-1.7H9v3.2h4.8c-.2 1.2-.8 2.2-1.8 2.8v2.3h2.9c1.7-1.6 2.7-3.9 2.7-6.6z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.4C2.4 15.9 5.5 18 9 18z"/><path fill="#FBBC04" d="M3.9 10.7c-.2-.5-.3-1.1-.3-1.7s.1-1.2.3-1.7V4.9H.9C.3 6.1 0 7.5 0 9s.3 2.9.9 4.1l3-2.4z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6C13.5.9 11.4 0 9 0 5.5 0 2.4 2.1.9 4.9l3 2.4C4.6 5.1 6.6 3.6 9 3.6z"/></svg>
      Google로 가입 신청
    </button>

    <div class="divider">또는 이메일로</div>

    <form id="email-form">
      <label>이름 *</label>
      <input type="text" name="full_name" required autocomplete="name" />

      <label>나이 *</label>
      <input type="number" name="age" min="18" max="120" required inputmode="numeric" />

      <label>이메일 *</label>
      <input type="email" name="email" required autocomplete="email" />

      <label>비밀번호 * <span style="font-weight:400;color:#888">(6자 이상)</span></label>
      <input type="password" name="password" required minlength="6" autocomplete="new-password" />

      <label>전화번호 *</label>
      <input type="tel" name="phone" required autocomplete="tel" placeholder="010-1234-5678" />

      <label>주소 *</label>
      <input type="text" name="address" required autocomplete="street-address" placeholder="시·도 시·군·구 동·읍·면 (상세주소까지)" />

      <label>전문직 *</label>
      <select name="profession" required>
        <option value="">선택</option>
        <option value="MD">의사 (MD)</option>
        <option value="PT">물리치료사 (PT)</option>
        <option value="DC">카이로프랙터 (DC)</option>
        <option value="student">학생 (의대·물리치료학과)</option>
        <option value="other">기타 의료인</option>
      </select>

      <label>소속 *</label>
      <input type="text" name="affiliation" required placeholder="병원·의원·학교명" />

      <label>면허번호 또는 학번 <span style="font-weight:400;color:#888">(승인 검토용)</span></label>
      <input type="text" name="license_number" placeholder="자격 확인용" />

      <div class="err" id="err"></div>
      <button type="submit">📨 가입 신청 제출</button>
    </form>

    <div class="alt">이미 계정이 있으신가요? <a href="./login.html">로그인</a></div>
  </div>

  <script type="module">
    import { supabase, sessionReady, signInWithGoogle, clearStaleAuth } from "./assets/supabase-client.js?v=20260526a";

    const errBox = document.getElementById("err");
    const showErr = (m) => { errBox.textContent = m; errBox.classList.add("show"); };

    const params = new URLSearchParams(location.search);
    const isFresh = params.has("fresh") || params.has("force");

    // 잠긴 챕터 등에서 튕겨 들어온 경우(?next=/chapter...) 좌측 상단 brand에 깜빡임 효과로
    // "홈으로 돌아가기" 동선을 시각적으로 유도. 직접 /signup 진입 시(next 없음)에는 비활성.
    const rawNext = params.get("next");
    if (rawNext && rawNext !== "/" && !rawNext.startsWith("/login") && !rawNext.startsWith("/signup")) {
      document.querySelector(".nav-brand")?.classList.add("cta-blink");
    }

    if (isFresh) {
      clearStaleAuth();
      try { await supabase.auth.signOut(); } catch {}
    } else {
      const session = await sessionReady;
      if (session) location.replace("/");
    }

    document.getElementById("google-btn").onclick = () => signInWithGoogle("/");

    document.getElementById("email-form").onsubmit = async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      // 가입 전에도 stale 청소 — 이전 세션 안 남도록
      clearStaleAuth();
      try { await supabase.auth.signOut(); } catch {}
      const fd = new FormData(e.target);
      const { data, error } = await supabase.auth.signUp({
        email: fd.get("email"),
        password: fd.get("password"),
        options: {
          data: {
            full_name: fd.get("full_name"),
            age: fd.get("age"),
            phone: fd.get("phone"),
            address: fd.get("address"),
            profession: fd.get("profession"),
            affiliation: fd.get("affiliation"),
            license_number: fd.get("license_number"),
          },
          emailRedirectTo: location.origin + "/",
        },
      });
      if (error) return showErr(error.message);

      // 자동 로그인 됐으면 바로 redirect
      if (data.session) {
        location.replace("/");
        return;
      }

      // 이메일 확인 필요 (autoconfirm OFF 상태)
      document.getElementById("card").innerHTML = `
        <div class="ok">
          <h2>✅ 가입 신청 완료</h2>
          <p>입력하신 이메일로 인증 링크를 보냈습니다.<br/>
          이메일 인증 후 관리자가 자격을 확인하면 모든 챕터 열람이 가능합니다.</p>
          <p style="margin-top:1.5rem">
            <a href="/guide" style="color:#0a84ff;margin-right:1rem">📖 사용 가이드</a>
            <a href="/login" style="color:#0a84ff">→ 로그인</a>
          </p>
        </div>`;
    };
  </script>
</body>
</html>
