<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style>
      .label { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .title { font-weight:700; letter-spacing:-0.02em; }
      .sub   { font-weight:400; fill:#6e6e73; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>

  <text x="480" y="50" class="label title" text-anchor="middle" font-size="28">Cox Flexion-Distraction Table 생체역학</text>
  <text x="480" y="78" class="label sub" text-anchor="middle" font-size="14">James Cox 1960s · 추간판 내압 -192 mmHg · 추간공 28% 확장</text>

  <!-- Table side view -->
  <rect x="80" y="160" width="800" height="50" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="200" y="190" class="label sub" text-anchor="middle" font-size="11">고정 thoracic piece</text>
  <text x="700" y="190" class="label sub" text-anchor="middle" font-size="11">가동 caudal piece</text>

  <!-- Caudal piece tilted -->
  <path d="M 480 210 L 880 210 L 880 260 L 480 260 Z" fill="#fff7e0" stroke="#d4a017" stroke-width="2" transform="rotate(-12 680 235)"/>
  <text x="700" y="280" class="label sub" text-anchor="middle" font-size="11">하퇴부 굴곡 (-12° flexion)</text>

  <!-- Pivot -->
  <circle cx="480" cy="210" r="8" fill="#0071e3"/>
  <text x="450" y="210" class="label sub" text-anchor="middle" font-size="10">pivot</text>

  <!-- Patient body -->
  <ellipse cx="320" cy="155" rx="200" ry="20" fill="#f0faff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="320" y="160" class="label sub" text-anchor="middle" font-size="11">환자 prone</text>

  <!-- Doctor hand at lumbar -->
  <ellipse cx="350" cy="148" rx="20" ry="10" fill="#ffe1a8" stroke="#d4a017" stroke-width="2"/>
  <text x="350" y="135" class="label sub" text-anchor="middle" font-size="10">CH</text>

  <!-- Y-axis distraction arrow -->
  <path d="M 530 300 L 800 320" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
  <polygon points="800,320 786,316 790,328" fill="#c0392b"/>
  <text x="660" y="345" class="label" text-anchor="middle" font-size="13" fill="#c0392b">y-axis distraction force</text>

  <!-- Force value -->
  <rect x="40" y="370" width="290" height="160" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="185" y="400" class="label title" text-anchor="middle" font-size="15">테이블 사양</text>
  <text x="60" y="430" class="label" font-size="13">• Distraction range: <tspan font-weight="700">0–40°</tspan></text>
  <text x="60" y="455" class="label" font-size="13">• Cycle time: <tspan font-weight="700">7-25-7 sec</tspan></text>
  <text x="60" y="480" class="label" font-size="13">• Force: <tspan font-weight="700">25–50 lbs (110–220 N)</tspan></text>
  <text x="60" y="505" class="label" font-size="13">• Lateral flexion option (±20°)</text>

  <rect x="350" y="370" width="290" height="160" rx="14" fill="#fff7e0" stroke="#d4a017" stroke-width="1.5"/>
  <text x="495" y="400" class="label title" text-anchor="middle" font-size="15" fill="#8a5a00">생체역학 효과</text>
  <text x="370" y="430" class="label" font-size="13">• 추간판 내압 <tspan font-weight="700" fill="#c0392b">-192 mmHg</tspan></text>
  <text x="370" y="455" class="label" font-size="13">• 추간공 면적 <tspan font-weight="700" fill="#c0392b">+28%</tspan></text>
  <text x="370" y="480" class="label" font-size="13">• 신경근 압박 감소</text>
  <text x="370" y="505" class="label sub" font-size="11">근거: Gudavalli 2016 (NIH funded RCT)</text>

  <rect x="660" y="370" width="260" height="160" rx="14" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="400" class="label title" text-anchor="middle" font-size="15" fill="#8a1c12">절대 금기</text>
  <text x="680" y="430" class="label" font-size="13">• 급성 cauda equina syndrome</text>
  <text x="680" y="455" class="label" font-size="13">• 척추 골절·종양</text>
  <text x="680" y="480" class="label" font-size="13">• 진행성 신경학적 결손</text>
  <text x="680" y="505" class="label" font-size="13">• 척추 감염 (osteomyelitis)</text>
</svg>
