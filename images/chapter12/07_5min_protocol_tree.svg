<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <style>
      .label { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .title { font-weight:700; letter-spacing:-0.02em; }
      .sub   { font-weight:400; fill:#6e6e73; }
      .box   { fill:#fff; stroke:#1d1d1f; stroke-width:1.5; rx:10; }
      .stage { fill:#0a84ff; }
    </style>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#fbfbfd"/>

  <text x="500" y="40" class="label title" text-anchor="middle" font-size="26">한국 외래 5–10분 적용 프로토콜 — AK 핵심 도구만 추림</text>
  <text x="500" y="66" class="label sub" text-anchor="middle" font-size="13">정형·신경학적 검사 + indicator muscle + TL + targeted MMT → 의사결정 → 처치 → 재평가</text>

  <!-- Timeline header -->
  <line x1="60" y1="100" x2="940" y2="100" stroke="#1d1d1f" stroke-width="1"/>
  <text x="60"  y="92" class="label sub" font-size="10">0:00</text>
  <text x="280" y="92" class="label sub" font-size="10">1:00</text>
  <text x="500" y="92" class="label sub" font-size="10">3:00</text>
  <text x="720" y="92" class="label sub" font-size="10">4:30</text>
  <text x="940" y="92" class="label sub" font-size="10">5:00+</text>

  <!-- STAGE 1: Postural/Gait screen -->
  <rect x="60" y="120" width="200" height="100" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="160" y="146" class="label" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">STAGE 1 · 0:00–1:00</text>
  <text x="160" y="170" class="label title" text-anchor="middle" font-size="14">Postural + Gait</text>
  <text x="160" y="190" class="label sub" text-anchor="middle" font-size="11">머리·견갑·골반 정렬</text>
  <text x="160" y="206" class="label sub" text-anchor="middle" font-size="11">호흡 패턴 · 보행 5보</text>

  <line x1="260" y1="170" x2="288" y2="170" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- STAGE 2: Indicator muscle baseline + TL -->
  <rect x="290" y="120" width="200" height="100" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="390" y="146" class="label" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">STAGE 2 · 1:00–3:00</text>
  <text x="390" y="170" class="label title" text-anchor="middle" font-size="14">Indicator + TL</text>
  <text x="390" y="190" class="label sub" text-anchor="middle" font-size="11">Deltoid/Psoas baseline</text>
  <text x="390" y="206" class="label sub" text-anchor="middle" font-size="11">환자가 호소 부위 TL</text>

  <line x1="490" y1="170" x2="518" y2="170" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- STAGE 3: Targeted MMT (5-6 muscles) -->
  <rect x="520" y="120" width="200" height="100" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="620" y="146" class="label" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">STAGE 3 · 3:00–4:30</text>
  <text x="620" y="170" class="label title" text-anchor="middle" font-size="14">Targeted MMT</text>
  <text x="620" y="190" class="label sub" text-anchor="middle" font-size="11">호소부에 따른</text>
  <text x="620" y="206" class="label sub" text-anchor="middle" font-size="11">3-5개 specific 근육</text>

  <line x1="720" y1="170" x2="748" y2="170" stroke="#1d1d1f" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- STAGE 4: Adjust + retest -->
  <rect x="750" y="120" width="200" height="100" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="850" y="146" class="label" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">STAGE 4 · 4:30–5:00+</text>
  <text x="850" y="170" class="label title" text-anchor="middle" font-size="14">Adjust + Retest</text>
  <text x="850" y="190" class="label sub" text-anchor="middle" font-size="11">선택 기법 적용 후</text>
  <text x="850" y="206" class="label sub" text-anchor="middle" font-size="11">동일 근육 재평가</text>

  <!-- Decision tree -->
  <text x="500" y="270" class="label title" text-anchor="middle" font-size="17">의사 결정 — 호소 부위별 우선 검사 근육</text>

  <!-- Root -->
  <rect x="420" y="290" width="160" height="50" rx="8" fill="#1d1d1f"/>
  <text x="500" y="320" class="label" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">환자 주호소</text>

  <!-- 3 branches -->
  <line x1="500" y1="340" x2="180" y2="380" stroke="#1d1d1f" stroke-width="1.5"/>
  <line x1="500" y1="340" x2="500" y2="380" stroke="#1d1d1f" stroke-width="1.5"/>
  <line x1="500" y1="340" x2="820" y2="380" stroke="#1d1d1f" stroke-width="1.5"/>

  <!-- Branch 1: Low back -->
  <rect x="80" y="380" width="200" height="240" rx="10" fill="#f0faff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="180" y="406" class="label title" text-anchor="middle" font-size="14" fill="#0a4f8c">요통 / 골반</text>
  <text x="180" y="430" class="label sub" text-anchor="middle" font-size="10.5">우선 검사 5근육</text>
  <text x="100" y="456" class="label" font-size="12">• Gluteus medius</text>
  <text x="100" y="476" class="label" font-size="12">• Psoas major</text>
  <text x="100" y="496" class="label" font-size="12">• Quadratus lumborum</text>
  <text x="100" y="516" class="label" font-size="12">• Iliopsoas</text>
  <text x="100" y="536" class="label" font-size="12">• Hamstrings</text>
  <text x="100" y="572" class="label sub" font-size="10.5" font-weight="700">주된 처치</text>
  <text x="100" y="592" class="label sub" font-size="10.5">SI joint adj. / Diversified L</text>
  <text x="100" y="606" class="label sub" font-size="10.5">+ Glut med activation</text>

  <!-- Branch 2: Cervical -->
  <rect x="400" y="380" width="200" height="240" rx="10" fill="#f0faff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="500" y="406" class="label title" text-anchor="middle" font-size="14" fill="#0a4f8c">경추 / 두통</text>
  <text x="500" y="430" class="label sub" text-anchor="middle" font-size="10.5">우선 검사 5근육</text>
  <text x="420" y="456" class="label" font-size="12">• Deep neck flexors</text>
  <text x="420" y="476" class="label" font-size="12">• Upper trapezius</text>
  <text x="420" y="496" class="label" font-size="12">• Levator scapulae</text>
  <text x="420" y="516" class="label" font-size="12">• Sternocleidomastoid</text>
  <text x="420" y="536" class="label" font-size="12">• Rhomboids</text>
  <text x="420" y="572" class="label sub" font-size="10.5" font-weight="700">주된 처치</text>
  <text x="420" y="592" class="label sub" font-size="10.5">Diversified C / Activator</text>
  <text x="420" y="606" class="label sub" font-size="10.5">+ DNF 활성화 운동</text>

  <!-- Branch 3: Shoulder -->
  <rect x="720" y="380" width="200" height="240" rx="10" fill="#f0faff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="820" y="406" class="label title" text-anchor="middle" font-size="14" fill="#0a4f8c">견갑 / 상지</text>
  <text x="820" y="430" class="label sub" text-anchor="middle" font-size="10.5">우선 검사 5근육</text>
  <text x="740" y="456" class="label" font-size="12">• Supraspinatus</text>
  <text x="740" y="476" class="label" font-size="12">• Lower trapezius</text>
  <text x="740" y="496" class="label" font-size="12">• Serratus anterior</text>
  <text x="740" y="516" class="label" font-size="12">• Infraspinatus</text>
  <text x="740" y="536" class="label" font-size="12">• Subscapularis</text>
  <text x="740" y="572" class="label sub" font-size="10.5" font-weight="700">주된 처치</text>
  <text x="740" y="592" class="label sub" font-size="10.5">Thompson T / Activator</text>
  <text x="740" y="606" class="label sub" font-size="10.5">+ Scap stab 운동</text>

  <!-- Footnote -->
  <text x="500" y="660" class="label sub" text-anchor="middle" font-size="11.5" font-style="italic">⚠ 본 프로토콜은 정형·신경학적 표준 검사를 대체하지 않는다. red flag(야간통·체중감소·감각/근력 결손·외상)는 즉시 영상·전문의 의뢰.</text>
</svg>
