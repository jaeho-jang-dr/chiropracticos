<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style>
      .label { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .title { font-weight:700; letter-spacing:-0.02em; }
      .sub   { font-weight:400; fill:#6e6e73; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>

  <text x="480" y="50" class="label title" text-anchor="middle" font-size="28">MMT 표준 프로토콜 — 무엇을 측정하는가</text>
  <text x="480" y="78" class="label sub" text-anchor="middle" font-size="14">Manual Muscle Testing — 근골격 vs 진단 도구의 명확한 구분</text>

  <!-- Test setup illustration -->
  <rect x="40" y="120" width="380" height="400" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
  <text x="230" y="150" class="label title" text-anchor="middle" font-size="16">표준 시험 자세</text>

  <!-- Patient arm -->
  <rect x="100" y="220" width="200" height="14" rx="7" fill="#fff7e0" stroke="#d4a017" stroke-width="2"/>
  <text x="200" y="245" class="label sub" text-anchor="middle" font-size="11">환자 어깨 외전 90°</text>

  <!-- Doctor force arrow -->
  <path d="M 200 200 L 200 220" stroke="#c0392b" stroke-width="3" fill="none"/>
  <polygon points="200,220 193,208 207,208" fill="#c0392b"/>
  <text x="220" y="210" class="label" font-size="13" fill="#c0392b">검사자 압력 (하방)</text>

  <!-- Patient resistance -->
  <path d="M 200 270 L 200 290" stroke="#2d7a3a" stroke-width="3" fill="none"/>
  <polygon points="200,270 193,282 207,282" fill="#2d7a3a"/>
  <text x="220" y="290" class="label" font-size="13" fill="#1d5a2a">환자 저항 (상방 유지)</text>

  <text x="60" y="335" class="label title" font-size="13">시험 절차</text>
  <text x="60" y="358" class="label" font-size="12">① 환자 자세 표준화 (관절각 정확히)</text>
  <text x="60" y="380" class="label" font-size="12">② "팔을 그대로 두세요" 지시</text>
  <text x="60" y="402" class="label" font-size="12">③ 검사자 점진적 압력 증가</text>
  <text x="60" y="424" class="label" font-size="12">④ "강함" / "약함" 판정 (yes/no)</text>
  <text x="60" y="448" class="label" font-size="12">⑤ 양측 비교 + 다른 근육 검사</text>

  <text x="230" y="478" class="label sub" text-anchor="middle" font-size="11">검사자 교육 표준화 시 r = 0.85 (Schmitt 2007)</text>
  <text x="230" y="495" class="label sub" text-anchor="middle" font-size="11">조건부 신뢰도 — 비표준화 시 0.5 이하</text>

  <!-- Right: What MMT is good for vs not -->
  <rect x="440" y="120" width="480" height="180" rx="14" fill="#e8f5e9" stroke="#2d7a3a" stroke-width="2"/>
  <text x="680" y="150" class="label title" text-anchor="middle" font-size="16" fill="#1d5a2a">🟢 MMT 유효 영역 — 본 강의 채택</text>
  <text x="460" y="180" class="label" font-size="13">• 근력 약화 평가 (재활의학 기본)</text>
  <text x="460" y="202" class="label" font-size="13">• 신경근 손상 스크리닝</text>
  <text x="460" y="224" class="label" font-size="13">• 운동 후 변화 추적</text>
  <text x="460" y="246" class="label" font-size="13">• 근막 trigger point 평가 보조</text>
  <text x="460" y="268" class="label" font-size="13">• 표준화된 ROM 검사와 결합</text>
  <text x="460" y="290" class="label sub" font-size="11">근거: Cuthbert/Goodheart 2007 SR — 재현성 0.85 (조건부)</text>

  <rect x="440" y="320" width="480" height="220" rx="14" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="680" y="350" class="label title" text-anchor="middle" font-size="16" fill="#8a1c12">🔴 MMT 무효 영역 — 본 강의 비판</text>
  <text x="460" y="378" class="label" font-size="13">• 알레르기 진단 (음식 들고 MMT)</text>
  <text x="460" y="400" class="label" font-size="13">• 영양 결핍 진단</text>
  <text x="460" y="422" class="label" font-size="13">• 알약·보조제 효과 평가</text>
  <text x="460" y="444" class="label" font-size="13">• 장기 기능 진단 (간·심장 etc.)</text>
  <text x="460" y="466" class="label" font-size="13">• "Therapy localization" 인과론</text>
  <text x="460" y="488" class="label" font-size="13">• Subluxation으로 전신 질환 진단</text>
  <text x="460" y="513" class="label sub" font-size="11">근거: Kenney 1988, Garrow 1988 — 위약 통제 시 무작위 결과 (No evidence)</text>
  <text x="460" y="530" class="label sub" font-size="11">→ AK의 진단적 활용 주장은 본 강의 명시 부정</text>
</svg>
