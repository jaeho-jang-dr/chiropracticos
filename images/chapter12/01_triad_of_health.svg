<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style>
      .label { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .title { font-weight:700; letter-spacing:-0.02em; }
      .sub   { font-weight:400; fill:#6e6e73; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>

  <text x="480" y="50" class="label title" text-anchor="middle" font-size="28">AK Triad of Health — 건강의 3축</text>
  <text x="480" y="78" class="label sub" text-anchor="middle" font-size="14">George Goodheart 1964 · 구조·화학·정신의 상호의존 모델</text>

  <!-- Triangle -->
  <polygon points="480,140 240,460 720,460" fill="none" stroke="#1d1d1f" stroke-width="2"/>

  <!-- Top vertex - Structural -->
  <circle cx="480" cy="140" r="50" fill="#f0faff" stroke="#3182ce" stroke-width="3"/>
  <text x="480" y="138" class="label title" text-anchor="middle" font-size="16">구조</text>
  <text x="480" y="158" class="label sub" text-anchor="middle" font-size="11">Structural</text>

  <!-- Bottom-left - Chemical -->
  <circle cx="240" cy="460" r="50" fill="#fff7e0" stroke="#d4a017" stroke-width="3"/>
  <text x="240" y="458" class="label title" text-anchor="middle" font-size="16" fill="#8a5a00">화학</text>
  <text x="240" y="478" class="label sub" text-anchor="middle" font-size="11">Chemical</text>

  <!-- Bottom-right - Mental -->
  <circle cx="720" cy="460" r="50" fill="#e8f5e9" stroke="#2d7a3a" stroke-width="3"/>
  <text x="720" y="458" class="label title" text-anchor="middle" font-size="16" fill="#1d5a2a">정신</text>
  <text x="720" y="478" class="label sub" text-anchor="middle" font-size="11">Mental</text>

  <!-- Center text -->
  <text x="480" y="320" class="label title" text-anchor="middle" font-size="18" fill="#6e6e73">건강 = 균형</text>
  <text x="480" y="345" class="label sub" text-anchor="middle" font-size="12">한 축이 무너지면 다른 축에 영향</text>

  <!-- Side panel - what AK does -->
  <rect x="50" y="140" width="170" height="120" rx="10" fill="#fff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="135" y="165" class="label title" text-anchor="middle" font-size="13">구조 평가</text>
  <text x="60" y="188" class="label sub" font-size="11">• 자세 분석</text>
  <text x="60" y="208" class="label sub" font-size="11">• 가동범위</text>
  <text x="60" y="228" class="label sub" font-size="11">• 척추 정렬</text>
  <text x="60" y="248" class="label sub" font-size="11">• 근육 균형</text>

  <rect x="60" y="510" width="170" height="40" rx="10" fill="#fff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="145" y="525" class="label sub" text-anchor="middle" font-size="11">영양·약물·독성</text>
  <text x="145" y="540" class="label sub" text-anchor="middle" font-size="10">(평가 한계 — 후술)</text>

  <rect x="740" y="510" width="170" height="40" rx="10" fill="#fff" stroke="#2d7a3a" stroke-width="1.5"/>
  <text x="825" y="525" class="label sub" text-anchor="middle" font-size="11">스트레스·정서</text>
  <text x="825" y="540" class="label sub" text-anchor="middle" font-size="10">(상담·운동 권장)</text>

  <!-- Bottom warning -->
  <rect x="40" y="385" width="880" height="80" rx="14" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="412" class="label title" text-anchor="middle" font-size="14" fill="#8a1c12">⚠ AK의 임상 한계</text>
  <text x="60" y="438" class="label" font-size="12">🟢 구조 평가(자세·가동범위·근균형)는 근골격 평가의 일부로 유효 — 본 강의 채택</text>
  <text x="60" y="458" class="label" font-size="12">🔴 MMT로 알레르기·영양·독성 진단은 No evidence — 본 강의 명시 비판</text>
</svg>
