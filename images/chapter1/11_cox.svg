<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <style>
      .initials { font-family: 'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif; font-weight:300; fill:#0071e3; letter-spacing:-0.03em; opacity:.35; }
      .name   { font-family: 'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif; font-weight:700; fill:#1d1d1f; letter-spacing:-0.02em; }
      .sub    { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; font-weight:400; fill:#6e6e73; }
      .note   { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; font-weight:400; fill:#86868b; font-style:italic; }
      .bar    { fill:#0071e3; }
    </style>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <text x="200" y="280" class="initials" font-size="160" text-anchor="middle">JMC</text>
  <rect x="40" y="350" width="40" height="3" class="bar" rx="1.5"/>
  <text x="40" y="395" class="name" font-size="22">James M. Cox</text>
  <text x="40" y="425" class="sub"  font-size="15">Cox Flexion-Distraction</text>
  <text x="40" y="470" class="note" font-size="11">Photo placeholder · 실사 사진 준비 예정</text>
</svg>
