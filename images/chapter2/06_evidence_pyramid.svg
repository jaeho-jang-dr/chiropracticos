<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .label { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .t { font-weight:700; }
      .s { fill:#6e6e73; font-weight:400; }
      .w { fill:#fff; }
    </style>
  </defs>
  <rect width="900" height="500" fill="#fbfbfd"/>
  <text x="450" y="45" class="label t" text-anchor="middle" font-size="26">근거 피라미드 — FN 임상 주장의 검증 기준</text>
  <text x="450" y="70" class="label s" text-anchor="middle" font-size="13">높을수록 근거 수준 강함</text>

  <polygon points="430,100 470,100 490,145 410,145" fill="#1f7a3f"/>
