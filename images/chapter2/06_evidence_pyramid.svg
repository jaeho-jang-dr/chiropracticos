  <text x="450" y="392" class="label w t" text-anchor="middle" font-size="14">Expert Opinion · Tradition</text>

  <text x="780" y="128" class="label s" font-size="12">🟢 Strong</text>
  <text x="780" y="178" class="label s" font-size="12">🟢 Strong</text>
  <text x="780" y="228" class="label s" font-size="12">🟡 Moderate</text>
  <text x="780" y="278" class="label s" font-size="12">🟡 Moderate</text>
  <text x="780" y="332" class="label s" font-size="12">🟠 Limited</text>
  <text x="780" y="388" class="label s" font-size="12">🔴 Weak</text>

  <text x="130" y="128" class="label s" font-size="11" text-anchor="end">Hillier Cochrane 2015</text>
  <text x="130" y="178" class="label s" font-size="11" text-anchor="end">Gross 2015</text>
  <text x="130" y="228" class="label s" font-size="11" text-anchor="end">Schneider 2014 RCT</text>
  <text x="130" y="278" class="label s" font-size="11" text-anchor="end">척추 수기 cohort</text>
  <text x="130" y="332" class="label s" font-size="11" text-anchor="end">Carrick 증례 보고</text>
  <text x="130" y="388" class="label s" font-size="11" text-anchor="end">"Innate Intelligence"</text>

  <text x="450" y="460" class="label s" text-anchor="middle" font-size="12">근거 수준이 낮은 주장일수록 과장·오류 가능성 증가 → 비판적 수용 필수</text>
