<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .label   { font-family: "Pretendard","Apple SD Gothic Neo",sans-serif; fill:#1d1d1f; }
      .title   { font-weight:700; letter-spacing:-0.02em; }
      .sub     { font-weight:400; fill:#6e6e73; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>

  <text x="480" y="50" class="label title" text-anchor="middle" font-size="28">신경계 Input → Process → Output 3단 모델</text>
  <text x="480" y="80" class="label sub"   text-anchor="middle" font-size="14">Sherrington 1906 — The Integrative Action of the Nervous System</text>

  <rect x="40" y="150" width="240" height="260" rx="16" fill="#fff7e0" stroke="#d4a017" stroke-width="2"/>
  <text x="160" y="190" class="label title" text-anchor="middle" font-size="22">① Input</text>
  <text x="160" y="218" class="label sub"   text-anchor="middle" font-size="14">Afferentation (구심성 입력)</text>
  <text x="60"  y="265" class="label"        font-size="14">• 관절·근 (기계수용기)</text>
  <text x="60"  y="290" class="label"        font-size="14">• 근방추·GTO</text>
  <text x="60"  y="315" class="label"        font-size="14">• 피부·시각·전정</text>
  <text x="60"  y="340" class="label"        font-size="14">• 내장·후각·미각</text>
  <text x="60"  y="370" class="label sub"    font-size="12">Aα · Aβ · Aδ · C 섬유</text>

  <rect x="340" y="150" width="280" height="260" rx="16" fill="#f0faff" stroke="#3182ce" stroke-width="2"/>
  <text x="480" y="190" class="label title" text-anchor="middle" font-size="22">② Process</text>
  <text x="480" y="218" class="label sub"   text-anchor="middle" font-size="14">Central Processing</text>
  <text x="360" y="265" class="label"        font-size="14">• 척수 (Gate Control)</text>
  <text x="360" y="290" class="label"        font-size="14">• 뇌간·망상체(RAS)</text>
  <text x="360" y="315" class="label"        font-size="14">• 소뇌 (협응·학습)</text>
  <text x="360" y="340" class="label"        font-size="14">• 시상·기저핵</text>
  <text x="360" y="365" class="label"        font-size="14">• 피질 (감각·운동·인지)</text>

  <rect x="680" y="150" width="240" height="260" rx="16" fill="#f0faf2" stroke="#27ae60" stroke-width="2"/>
  <text x="800" y="190" class="label title" text-anchor="middle" font-size="22">③ Output</text>
  <text x="800" y="218" class="label sub"   text-anchor="middle" font-size="14">Efferentation (원심성 출력)</text>
  <text x="700" y="265" class="label"        font-size="14">• α-운동뉴런 (근)</text>
  <text x="700" y="290" class="label"        font-size="14">• γ-운동뉴런 (방추)</text>
  <text x="700" y="315" class="label"        font-size="14">• 자율 (교감·부교감)</text>
  <text x="700" y="340" class="label"        font-size="14">• 하행 통증 조절</text>
  <text x="700" y="370" class="label sub"    font-size="12">PAG · LC · RVM</text>

  <path d="M 280 280 L 340 280" stroke="#86868b" stroke-width="2.5" fill="none"/>
  <polygon points="340,280 328,274 328,286" fill="#86868b"/>
  <path d="M 620 280 L 680 280" stroke="#86868b" stroke-width="2.5" fill="none"/>
  <polygon points="680,280 668,274 668,286" fill="#86868b"/>

  <path d="M 800 410 Q 800 480 480 480 Q 160 480 160 410" stroke="#86868b" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <text x="480" y="470" class="label sub" text-anchor="middle" font-size="12">Feedback — 운동·행동이 새로운 감각 입력을 만듦 (sensorimotor loop)</text>

  <text x="480" y="510" class="label sub" text-anchor="middle" font-size="11">이 3단은 FN Assessment·Treatment의 공통 프레임. 각 단계가 평가·자극의 타겟.</text>
</svg>
