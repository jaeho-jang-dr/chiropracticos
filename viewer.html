<style>
  .viewer-shell { max-width: 960px; margin: 32px auto 96px; padding: 0 24px; }
  .viewer-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .viewer-toolbar .src {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: #6e6e73; word-break: break-all;
  }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 980px;
    background: #f5f5f7; color: #1d1d1f; text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: background .15s ease;
  }
  .btn-back:hover { background: #ebebed; }
  .markdown-body {
    background: #fff; border-radius: 18px; padding: 44px 56px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1d1d1f;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    border-bottom: none; margin-top: 1.6em;
    scroll-margin-top: 80px;  /* glass-nav 가림 방지: TOC 점프 시 헤딩이 nav 아래로 가지 않도록 */
  }
  html { scroll-behavior: smooth; }
  .markdown-body h1 { font-size: 2em; }
  .markdown-body h2 { font-size: 1.55em; }
  .markdown-body pre {
    background: #f5f5f7; border-radius: 10px; padding: 16px 20px;
  }
  .markdown-body code {
    background: rgba(0,0,0,.04); border-radius: 5px; padding: 0 5px;
  }
  .markdown-body table {
    display: table; width: 100%;
  }
  /* X-ray schematic SVG grid (Ch4 Gonstead listing) */
  .markdown-body .xray-schema-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 1.25rem;
    margin: 1.5rem 0;
  }
  .markdown-body .xray-schema {
    background: #0b1220;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    overflow: hidden;
  }
  .markdown-body .xray-schema-title {
    color: #38bdf8;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 10px;
  }
  .markdown-body .xray-svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
  }
  @media (max-width: 640px) {
    .markdown-body .xray-schema-grid { grid-template-columns: 1fr; }
  }
  /* Mermaid 다이어그램 — 기본 SVG가 너무 작아 안 보이는 문제 해결 */
  .markdown-body .mermaid {
    margin: 1.5rem 0;
    padding: 1.25rem;
    background: #fafafc;
    border: 1px solid #ebebed;
    border-radius: 12px;
    overflow-x: auto;
    text-align: center;
  }
  .markdown-body .mermaid svg {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    min-height: 200px;
    display: block;
    margin: 0 auto;
  }
  /* flowchart node 글자 가독성 — Mermaid 기본 11px 너무 작음 */
  .markdown-body .mermaid .node text,
  .markdown-body .mermaid .nodeLabel,
  .markdown-body .mermaid .edgeLabel {
    font-size: 15px !important;
    font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif !important;
  }
  .markdown-body .mermaid .node rect,
  .markdown-body .mermaid .node polygon,
  .markdown-body .mermaid .node circle {
    stroke-width: 1.5px;
  }
  @media (max-width: 640px) {
    .markdown-body .mermaid { padding: 0.5rem; }
    .markdown-body .mermaid svg { min-height: 160px; }
    .markdown-body .mermaid .node text,
    .markdown-body .mermaid .nodeLabel,
    .markdown-body .mermaid .edgeLabel {
      font-size: 13px !important;
    }
  }
  .error-box {
    background: #fff2f0; border: 1px solid #ffccc7;
    color: #a8071a; padding: 20px; border-radius: 12px;
    font-size: 14px;
  }
  @media (max-width: 640px) {
    .markdown-body { padding: 24px 20px; }

<body>

<nav class="glass-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="./index.html">
      <span class="brand-mark">📚</span>
      <span class="brand-name">카이로프랙틱정형외과</span>
    </a>
    <div class="nav-links">
      <a href="./index.html">홈</a>
    </div>
  </div>
</nav>

<main class="viewer-shell">
  <div class="viewer-toolbar">
    <a class="btn-back" href="javascript:history.back()">← 돌아가기</a>
    <span class="src" id="srcLabel"></span>
  </div>

  <article id="mdContent" class="markdown-body">불러오는 중…</article>
</main>

<script type="module">
import { sessionReady } from './assets/supabase-client.js';

(async () => {
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  const label = document.getElementById('srcLabel');
  const target = document.getElementById('mdContent');

  if (!src) {
    target.innerHTML = '<div class="error-box">⚠ <code>?src=경로/파일.md</code> 파라미터가 필요합니다.</div>';
    return;
  }

  // Restrict to relative paths within this site (no protocol, no leading /)
  if (/^[a-z]+:\/\//i.test(src) || src.startsWith('/')) {
    target.innerHTML = '<div class="error-box">⚠ 외부·절대 경로는 열 수 없습니다.</div>';
    return;
  }

  // 익명자 화이트리스트: 로그인 없으면 PUBLIC_VIEWER_PREFIXES 외 src 접근 차단.
  const session = await sessionReady;
  if (!session) {
    const allowed = (window.PUBLIC_VIEWER_PREFIXES || []).some(p => src.startsWith(p));
    if (!allowed) {
      const next = encodeURIComponent(location.pathname + location.search);
      location.replace(`/login?next=${next}`);
      return;
    }
  }

  label.textContent = src;
  document.title = src.split('/').pop() + ' · 강의록';

  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // Configure marked: GFM, breaks on. (headerIds / mangle 옵션은 marked v9+ 에서 제거됨 — 아래 후처리로 ID 부여)
    marked.setOptions({ gfm: true, breaks: false });

    // Render Mermaid blocks specially — marked turns ```mermaid into <pre><code class="language-mermaid">
    const rendered = marked.parse(text);
    const safe = DOMPurify.sanitize(rendered, { ADD_TAGS: ['iframe'], ADD_ATTR: ['frameborder', 'allowfullscreen'] });
    target.innerHTML = safe;

    // GitHub 호환 heading slug — TOC anchor (#11-정의와-패러다임 등) 매칭용.
    // GitHub은 공백을 그룹화하지 않고 한 글자씩 '-'로 변환하므로 "Part I — 기능" 같은
    // em dash 제거 후 남는 두 공백은 '--' 두 개가 되어야 한다.
    function githubSlug(s) {
      return s.toLowerCase().trim()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')  // 알파벳·숫자·한글·공백·하이픈만 남김
        .replace(/\s/g, '-');               // 공백 각각을 '-'로 (그룹화 X)
    }
    const usedIds = new Set();
    target.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      if (h.id) { usedIds.add(h.id); return; }
      const base = githubSlug(h.textContent || '');
      if (!base) return;
      let id = base, n = 1;
      while (usedIds.has(id)) { id = base + '-' + (n++); }
      usedIds.add(id);
      h.id = id;
    });

    // 페이지 로드 시 hash 가 있으면 (브라우저는 ID 부여 전 시점이라 못 찾았음) 수동 스크롤
    function scrollToHash(behavior) {
      if (!location.hash || location.hash.length < 2) return;
      const id = decodeURIComponent(location.hash.slice(1));
      const tgt = document.getElementById(id);
      if (tgt) tgt.scrollIntoView({ behavior: behavior || 'smooth', block: 'start' });
    }
    scrollToHash('instant');
    // 같은 페이지 내 TOC 클릭 시에도 안정적으로 스크롤 (브라우저 기본 동작이 막힌 경우 대비)
    window.addEventListener('hashchange', () => scrollToHash('smooth'));
    // 같은 hash 재클릭(브라우저는 hashchange 미발생)도 대응
    target.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.length < 2) return;
      // 같은 hash이면 hashchange 없으니 직접 scroll
      if (decodeURIComponent(href) === decodeURIComponent(location.hash)) {
        e.preventDefault();
        scrollToHash('smooth');
      }
    });

    // Replace ```mermaid code blocks with Mermaid-rendered SVGs
    target.querySelectorAll('code.language-mermaid').forEach((el, idx) => {
      const pre = el.parentElement;
      const code = el.textContent;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code;
      pre.replaceWith(div);
    });
    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        // 다이어그램 크기 — 작게 렌더되던 문제 해결
        flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
        sequence:  { useMaxWidth: false },
        gantt:     { useMaxWidth: false },
        themeVariables: {
          fontSize: '16px',
          fontFamily: '"Pretendard Variable", Pretendard, -apple-system, sans-serif',
        },
      });
      await mermaid.run({ querySelector: '.mermaid' });
      // 렌더 직후 SVG에 인라인 width 강제 — Mermaid가 600px 같은 고정폭으로 출력하는 경우 차단
      target.querySelectorAll('.mermaid svg').forEach((svg) => {
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.style.width = '100%';
        svg.style.maxWidth = '100%';
        svg.style.height = 'auto';
      });
    }

    // Adjust relative links inside rendered content so they still resolve from the MD's folder
    const baseDir = src.substring(0, src.lastIndexOf('/') + 1);
    target.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href) return;
      if (/^[a-z]+:\/\//i.test(href) || href.startsWith('#') || href.startsWith('/')) return;
      // MD-to-MD: reroute through viewer
      if (href.endsWith('.md') || href.includes('.md#')) {
        const absolute = new URL(baseDir + href, location.href).pathname;
        // strip leading / for relative
        const rel = absolute.replace(/^\//, '');
        a.setAttribute('href', './viewer.html?src=' + encodeURI(rel));
      } else {
        // Other relative: resolve from MD's folder
        a.setAttribute('href', baseDir + href);
      }
    });

    // Relative images
    target.querySelectorAll('img[src]').forEach(img => {
      const s = img.getAttribute('src');
      if (!s || /^[a-z]+:\/\//i.test(s) || s.startsWith('/')) return;
      img.setAttribute('src', baseDir + s);
    });

  } catch (e) {
    target.innerHTML = '<div class="error-box">⚠ 파일을 불러올 수 없습니다: ' + src + '<br/><small>' + e.message + '</small></div>';
  }
})();
</script>
