<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 처리</title>
  <script src="./assets/config.js?v=20260526c"></script>
  <style>body{font-family:system-ui;text-align:center;padding:6rem 2rem;color:#555;background:#fafafc}
    .card{max-width:420px;margin:0 auto;padding:2.5rem;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1px solid #e8e8eb}
    .spinner{width:32px;height:32px;border:3px solid #e8e8eb;border-top-color:#0a84ff;border-radius:50%;margin:0 auto 1.25rem;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{color:#c62828;margin-top:1rem;font-size:.9em}
    a{color:#0a84ff}</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div id="msg">로그인 처리 중...</div>
    <div class="err" id="err"></div>
  </div>
  <script type="module">
    // 이 페이지는 옛 redirectTo와의 호환성용 — 새 코드는 직접 redirect 사용.
    import { sessionReady } from "./assets/supabase-client.js?v=20260526c";
    const params = new URLSearchParams(location.search);
    let next = params.get("next") || "/";
    if (!next.startsWith("/") || next.startsWith("//")) next = "/";
    const session = await sessionReady;
    if (!session) {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const err = hash.get("error_description") || hash.get("error");
      document.getElementById("msg").textContent = "로그인 실패";
      document.getElementById("err").innerHTML =
        (err ? err + "<br>" : "세션이 생성되지 않았습니다.<br>") +
        '<a href="/login">← 다시 시도</a>';
      return;
    }
    history.replaceState(null, "", "/auth-callback");
    location.replace(next);
  </script>
</body>
</html>
