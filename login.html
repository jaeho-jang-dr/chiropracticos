<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | Chiropractic</title>
  <link rel="stylesheet" href="./assets/main.css?v=20260526b" />
<script defer src="./assets/ui.js?v=20260526b"></script>
<script defer src="./assets/download-guard.js?v=20260526b"></script>
<script defer src="./assets/hide-guard.js?v=20260526b"></script>
<script defer src="./assets/pdf-viewer.js?v=20260526b"></script>
  <script src="./assets/config.js?v=20260526b"></script>
  <style>
    .auth-card{max-width:420px;margin:5rem auto;padding:2.5rem;background:#fff;border:1px solid #e0e0e3;border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.04)}
    .auth-card h1{margin:0 0 .5rem;font-size:1.7rem}
    .auth-card p.lead{color:#666;margin:0 0 1.5rem;font-size:.92em}
    .auth-card label{display:block;font-size:.85em;color:#444;margin:1rem 0 .35rem;font-weight:600}
    .auth-card input{width:100%;padding:.75rem 1rem;border:1px solid #d2d2d7;border-radius:10px;font-size:.95em;font-family:inherit;box-sizing:border-box}
    .auth-card input:focus{outline:none;border-color:#0a84ff}
    .auth-card button[type=submit]{width:100%;padding:.85rem;border:none;border-radius:10px;background:#0a84ff;color:#fff;font-weight:600;cursor:pointer;margin-top:1.25rem;font-size:.95em}
    .auth-card .divider{text-align:center;margin:1.5rem 0;color:#999;font-size:.85em;position:relative}
    .auth-card .divider::before,.auth-card .divider::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:#e8e8eb}
    .auth-card .divider::before{left:0}.auth-card .divider::after{right:0}
    .auth-card .btn-google{width:100%;padding:.75rem;border:1px solid #d2d2d7;border-radius:10px;background:#fff;font-weight:500;cursor:pointer;font-size:.95em;display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:inherit}
    .auth-card .btn-google:hover{background:#f8f8fa}
    .auth-card .alt{text-align:center;margin-top:1.5rem;font-size:.88em;color:#666}
    .auth-card .alt a{color:#0a84ff;text-decoration:none}
    .err{color:#c62828;font-size:.88em;margin-top:.5rem;min-height:1em;line-height:1.4;background:#fdecea;padding:.5rem .75rem;border-radius:6px;display:none}
    .err.show{display:block}
    .info{font-size:.8em;color:#888;text-align:center;margin-top:1rem}

    /* 잠긴 챕터에서 튕겨 들어온 경우(?next=...) 좌측 상단 brand를 깜빡여 "홈으로 돌아가기" 동선을 시각적으로 유도 */
    @keyframes navBrandPulse {
      0%, 100% { box-shadow: 0 0 0 2px transparent, 0 0 0 0 rgba(10,132,255,0); }
      50%      { box-shadow: 0 0 0 2px rgba(10,132,255,.65), 0 0 14px rgba(10,132,255,.35); }
    }
    .nav-brand.cta-blink {
      border-radius: 12px;
      padding: 4px 12px;
      animation: navBrandPulse 1.4s ease-in-out infinite;
    }
    .nav-brand.cta-blink::after {
      content: '← 홈으로';
      margin-left: 8px;
      font-size: .72em;
      color: #0a84ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <nav class="site-nav"><div class="nav-inner">
    <a class="nav-brand" href="./index.html"><span class="mark"></span><span>Chiropractic</span></a>
  </div></nav>

  <div class="auth-card">
    <h1>로그인</h1>
    <p class="lead">의료인(MD/PT) 전용. 처음이시라면 <a href="./signup.html">가입</a>하세요.</p>

    <button id="google-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.1-.2-1.7H9v3.2h4.8c-.2 1.2-.8 2.2-1.8 2.8v2.3h2.9c1.7-1.6 2.7-3.9 2.7-6.6z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.4C2.4 15.9 5.5 18 9 18z"/><path fill="#FBBC04" d="M3.9 10.7c-.2-.5-.3-1.1-.3-1.7s.1-1.2.3-1.7V4.9H.9C.3 6.1 0 7.5 0 9s.3 2.9.9 4.1l3-2.4z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6C13.5.9 11.4 0 9 0 5.5 0 2.4 2.1.9 4.9l3 2.4C4.6 5.1 6.6 3.6 9 3.6z"/></svg>
      Google로 계속하기
    </button>

    <div class="divider">또는</div>

    <form id="email-form">
      <label>이메일</label>
      <input type="email" name="email" required autocomplete="email" />
      <label>비밀번호</label>
      <input type="password" name="password" required autocomplete="current-password" minlength="6" />
      <div class="err" id="err"></div>
      <button type="submit">로그인</button>
    </form>

    <div class="alt">계정이 없으신가요? <a href="./signup.html">가입하기</a></div>
    <div class="alt"><a href="?fresh=1" style="color:#888;font-size:.85em">↻ 다른 계정으로 / 강제 재로그인</a></div>
    <div class="info">문제 시 <a href="/debug">/debug</a>에서 강제 로그아웃 가능</div>
  </div>

  <script type="module">
    import { supabase, sessionReady, signInWithGoogle, signInWithEmail, clearStaleAuth } from "./assets/supabase-client.js?v=20260526b";

    const params = new URLSearchParams(location.search);
    let next = params.get("next") || "/";
    // open redirect 방어 — same-origin path만 허용 (//evil.com, https://… 차단)
    if (!next.startsWith("/") || next.startsWith("//") || next.startsWith("/login")) next = "/";

    // 잠긴 챕터 등에서 튕겨 들어온 경우(?next=/chapter...) 좌측 상단 brand에 깜빡임 효과로
    // "홈으로 돌아가기" 동선을 시각적으로 유도. 직접 /login 진입 시(next 없음)에는 비활성.
    const rawNext = params.get("next");
    if (rawNext && rawNext !== "/" && !rawNext.startsWith("/login")) {
      document.querySelector(".nav-brand")?.classList.add("cta-blink");
    }
    // ?fresh=1 또는 ?force=1 → 기존 세션 무시, 강제 신선 재로그인
    const isFresh = params.has("fresh") || params.has("force");
    const errBox = document.getElementById("err");

    function showErr(msg) {
      errBox.textContent = msg;
      errBox.classList.add("show");
    }

    if (isFresh) {
      // 모든 stale 청소 — 페이지에 머물러서 사용자가 새로 입력 가능
      clearStaleAuth();
      try { await supabase.auth.signOut(); } catch {}
    } else {
      // 평소: 이미 로그인된 사용자는 next로 자동 이동
      const session = await sessionReady;
      if (session) location.replace(next);
    }

    // 에러가 hash에 있으면 표시
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (hash.get("error")) {
      showErr(`OAuth 오류: ${hash.get("error_description") || hash.get("error")}`);
      history.replaceState(null, "", location.pathname + location.search);
    }

    // 모든 로그인 버튼은 stale 자동 청소 후 신선 시작
    document.getElementById("google-btn").onclick = () => signInWithGoogle(next);

    document.getElementById("email-form").onsubmit = async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      const fd = new FormData(e.target);
      const { error } = await signInWithEmail(fd.get("email"), fd.get("password"));
      if (error) { showErr(error.message); return; }
      location.replace(next);
    };
  </script>
</body>
</html>
